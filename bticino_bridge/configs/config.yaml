# BTicino Bridge - Single Complete Configuration
# Version: v0.14.1
# Last updated: 2026-03-26
#
# THIS IS THE ONLY CONFIGURATION FILE IN USE
# The other files in configs/ are only historical examples
# Features v0.14.1: QML→Bridge→MQTT sync (device config, ringtones, volumes, display)

# ==================== BRIDGE ====================
bridge:
  name: "BTicino Bridge Enhanced"
  version: "0.14.1"
  log_level: "debug"  # no effect, use logging.level

# ==================== OPENWEBNET ====================
openwebnet:
  host: "127.0.0.1"
  port: 30006
  timeout: 5000ms
  retry_attempts: 3
  retry_delay: 1000ms

# ==================== SIP ====================
sip:
  enabled: true
  local_host: "127.0.0.1"
  local_port: 5060
  server_host: "127.0.0.1"  # Flexisip local
  server_port: 5060
  transport: "tcp"  # tcp, udp, tls
  # look for the right domain for your device under /home/bticino/cfg/extra/90/flexisip/flexisip.conf
  domain: "YOUR_GATEWAY_ID.bs.iotleg.com"
  username: "webrtc"          # Per slyoldfox: register as webrtc@domain
  # password: omit it — the bridge derives MD5(username:domain:username) at
  # startup (same convention as the answerer identity). Set sip.password only
  # to override with the md5 hash from your flexisip users.db.txt.
  dev_addr: "20"
  use_ha1: true
  insecure_tls: true
  # sip_target: optional INVITE/BYE target override (defaults to the answerer
  # identity per bticino.DeviceVariant: c100x here, c300x on Classe 300X).
  # native_dev_addr: unit UUID offered in session SDP (a=DEVADDR). Verified
  # per unit (wrong values get an instant 486); required for camera sessions.
  # Find yours via the settings wizard. Unrelated to the numeric dev_addr above.

  # On-demand SIP answerer from HA (F1). Fail-closed: enabled=false by default.
  # Enable it only after registering the route with scripts/setup_answerer_route.sh
  # (see docs/answerer-setup.md). scripts/deploy.sh overwrites the device's
  # config.yaml unless --skip-config is used.
  answerer:
    enabled: false          # F1 master switch (set to true on the device after registering the route)
    user: "bridge"
    audio_port: 10100
    video_port: 10102       # -1 = reject m=video (audio-only)
    max_call_seconds: 120
    ring_timeout_seconds: 70 # ring guard: with no answer and no CANCEL, closes with 480 (default 70, like app 1.17.3)
    talk_enabled: false     # F2: talk from HA (mic→go2rtc :40004→ffmpeg SRTP→door panel); set to true on the device
    talk_keepalive: false   # continuous uplink audio (speex silence while the mic is quiet) so the door panel opens the downlink audio; requires talk_enabled
    route_file: "/etc/flexisip/users/route_ext.conf"

# ==================== MQTT ====================
mqtt:
  enabled: true
  host: "<CHANGE_ME>"
  port: 1883
  username: "<CHANGE_ME>"
  password: "<CHANGE_ME>"
  client_id: "bticino_bridge"
  topic_prefix: "bticino"
  # Restart buttons in HA (Configuration section): restart the bridge and
  # reboot the device. DISABLED by default (reboot restarts the whole
  # video intercom). Set to true to expose them.
  enable_system_buttons: false

# ==================== WEB DASHBOARD ====================
web:
  enabled: true
  port: 8082
  static_dir: "web/static"
  templates_dir: "web/templates"

# ==================== HOMEKIT ====================
homekit:
  enabled: false
  name: "BTicino Bridge"
  manufacturer: "BTicino"
  model: "Classe C100X"
  port: "8081"
  pin: "12345678"
  storage_path: "./homekit_data"

# ==================== HARDWARE ====================
hardware:
  enabled: true
  input_device: "/dev/input/event0"
  gpio_monitoring: true
  i2c_scanning: false
  polling_interval: 100ms

# ==================== LOGGING ====================
logging:
  level: 'info'
  file: '/var/log/bticino_bridge.log'
  max_size: 2MB   # per file; lives in RAM, max_size x max_files must not exceed 48MB
  max_files: 3    # total files, including the active one

# ==================== STREAMING (RTSP/WebRTC) ====================
streaming:
  enabled: true
  rtsp_port: 6554
  webrtc_enabled: false
  webrtc_port: 8889
  recording_path: "/home/bticino/cfg/extra/recordings"
  max_duration: 60  # seconds
  auto_stop_on_last_client: true
  # SAFETY: on-demand video activation (RTSP self-INVITE, automatic
  # start on doorbell press, and snapshots). DISABLED by default: enabling
  # video competes with the native firmware and can cause instability/reboot.
  # Set to true ONLY once the video pipeline is validated on your unit.
  video_on_demand: false
  # Camera video backend (only applies if video_on_demand: true):
  #   avmedia   -> *7*300 command: bt_av_media duplicates its RTP towards us
  #                (cooperative with the native firmware; doesn't fight over /dev/video0)
  #   gstreamer -> direct GStreamer pipeline with the VPU (competes with native,
  #                may fail with "Internal data stream error" when cold)
  #   auto      -> tries avmedia and falls back to gstreamer if no RTP flows
  video_backend: "avmedia"
  # Live video during an incoming call to OUR unit, via passive
  # mirror (tap of the native video leg on lo:<native-port> towards the
  # relay; 5007 high-res on c300x, 5002 low-res on c100x, selected via
  # bticino.DeviceVariant in the code — rebuild after changing it). Sends
  # no commands to the bus; independent of video_on_demand.
  live_on_call: true
  # camera_session: bridge-initiated headless video (loopback self-INVITE
  # answered natively, display stays off) as HA switch
  # bticino/video/session/set. Off by default; duration in seconds.
  camera_session: false
  camera_session_duration: 30
  # live_audio_on_call: mirror the native audio leg (lo:5000) to the RTSP audio
  # relay. Not verified on the Classe 100X, off by default.
  live_audio_on_call: false

# ==================== NETWORK ====================
network:
  ntp:
    enabled: true
    server: "pool.ntp.org"
    port: 123
  dns:
    servers:
      - "192.168.1.1"
      - "8.8.8.8"
  firewall:
    block_telemetry: true  # Block telemetry to BTicino
    block_cloud: false     # Block Netatmo cloud
    allow_updates: false   # Allow automatic updates

# ==================== EXTERNAL SERVERS ====================
servers:
  cloud:
    enabled: false
    host: "nv2-bncx.netatmo.net"
    port: 25050
    protocol: "tcp"
    description: "Netatmo Cloud"
    required: false
  logging:
    enabled: false
    host: "log.bs.iotleg.com"
    port: 5001
    protocol: "udp"
    description: "BTicino Log Server"
    required: false
  updates:
    enabled: false
    host: "n3tfw.blob.core.windows.net"
    port: 443
    protocol: "https"
    description: "Firmware Updates (Azure)"
    required: false
  sip_official:
    enabled: false
    host: "sipserver.bs.iotleg.com"
    port: 5061
    protocol: "tls"
    description: "BTicino Official SIP Server"
    required: false

# ==================== NOTIFICATIONS ====================
notifications:
  mqtt:
    enabled: true
    topic: "bticino/notifications"
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: ""
    password: ""
    from: ""
    to: ""
  pushover:
    enabled: false
    api_key: ""
    user_key: ""
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

# ==================== PRIVACY ====================
privacy:
  block_external_telemetry: true
  block_log_server: true
  block_cloud: false
  disable_auto_updates: true
  local_logging: true

# ==================== SECURITY ====================
security:
  # Basic Auth for the WHOLE dashboard and API (includes /api/config, which
  # contains plaintext passwords). Enabled without web_password → the server
  # responds 503 (fail-closed). The browser will ask for login only once.
  web_auth_required: true
  web_username: "<CHANGE_ME>"
  web_password: "<CHANGE_ME>"
  web_https_enabled: false  # Enable HTTPS
  api_rate_limit: 100       # Requests per minute
  config_audit_log: true    # Configuration change log

# ==================== ADDITIONAL LOCKS ====================
additional_locks:
  # - name: "Back Door"
  #   where: 21
  # - name: "Side Door"
  #   where: 22

# ==================== ACCESS CLASSIFIER ====================
# Classifies each door opening as "visitor" or "resident" (key/RFID) by
# correlating it with earlier rings and calls. Only listens to the internal bus;
# sends no commands.
access:
  enabled: false
  correlation_window: 30s      # opening within this time after a ring or call → "visitor"
  max_hold_wait: 8s            # how long to wait for the door to close to measure the pulse duration
  duration_visitor_max: 3500ms # duration ≤ → "visitor" range (only adjusts the CONFIDENCE, not the label)

# ==================== UDP PROXY ====================
udp_proxy:
  enabled: false
  listen_port: 40004
  target_port: 4000

# ==================== FULL-DUPLEX AUDIO ====================
# Full-duplex audio on the bridge's own leg (listen to and talk with the door).
# Fail-closed: if the block is omitted, it stays disabled.
audio:
  duplex_enabled: false
  duplex_sink_path: "/home/bticino/cfg/extra/recordings/door_audio.wav"
  # Passive mirror of the native downlink audio (tap lo:5000, design doc
  # 2026-08-21-audio-tap-5000). Fail-closed: if omitted, it stays disabled.
  listen_tap_enabled: false
  # Dedicated WAV sink of the passive listener (separate from duplex_sink_path, so
  # it does not share a file with the duplex leg).
  listen_sink_path: "/home/bticino/cfg/extra/recordings/door_audio_listen.wav"
